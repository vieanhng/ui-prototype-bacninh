<!doctype html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiến độ khoá học</title>
<link rel="icon" href="../assets/favicon_bn.png">
<link rel="stylesheet" href="../tvet.css">
<style>
  .bar-top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 16px; }
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin: 0 0 16px; }
  .kpi { padding: 16px 18px; border-radius: var(--tv-r-md); }
  .kpi span { display: block; font-size: 13px; color: var(--tv-text-muted); }
  .kpi b { display: block; margin-top: 4px; font-size: 28px; font-weight: 700; color: var(--tv-heading); line-height: 1.2; }
  .kpi small { font-size: 12px; color: var(--tv-text-muted); }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; margin-bottom: 16px; }
  .card-h { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .card-h h3 { margin: 0; font-size: 16px; font-weight: 600; color: var(--tv-heading); flex: 1; }
  .card-b { padding: 0; }
  .hbars { display: grid; gap: 10px; }
  .hbar { display: grid; grid-template-columns: 190px minmax(0, 1fr) 48px; gap: 10px; align-items: center; font-size: 13px; }
  .hbar > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hbar .track { height: 14px; background: var(--tv-track); border-radius: 0 4px 4px 0; }
  .hbar .fill { height: 100%; border-radius: 0 4px 4px 0; background: var(--tv-primary); min-width: 2px; }
  .hbar b { text-align: right; font-weight: 600; color: var(--tv-heading); }
  .linkbtn { border: 0; background: none; padding: 0; font: 600 13px var(--tv-font); color: var(--tv-primary); cursor: pointer; }
  .tip { position: fixed; z-index: 1200; pointer-events: none; padding: 6px 10px; border-radius: 6px; background: rgba(0,0,0,.82); color: #fff; font-size: 12px; line-height: 1.45; max-width: 280px; }
  .tbl-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin: 0 0 12px; }
  .tbl-tools .tv-input { width: 220px; height: 37px; }
  .tv-table th, .tv-table td { padding: 12px 14px; }
  .tv-table .c { text-align: center; }
  .sticky th:first-child, .sticky td:first-child { position: sticky; left: 0; z-index: 1; background: var(--tv-surface); }
  .tv-table tr.click { cursor: pointer; }
  .tv-table tr.click:hover td { background: var(--tv-primary-soft); }
  .tv-table tr.chap td { background: var(--tv-muted-bg); font-weight: 600; color: var(--tv-heading); }
  .tv-table tr.unrel td { color: var(--tv-text-muted); }
  .pcell { min-width: 120px; }
  .pcell .tv-bar { height: 6px; margin-top: 4px; }
  .pcell .tv-bar > span { background: var(--tv-primary); }
  .pcell span { font-size: 12px; color: var(--tv-text-muted); }
  .pcell .tv-bar > span { display: block; }
  .st { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .st--done { color: var(--tv-success); background: var(--tv-success-bg); }
  .st--late { color: var(--tv-warning); background: var(--tv-warning-bg); }
  .st--miss { color: var(--tv-danger); background: var(--tv-danger-bg); }
  .st--doing { color: var(--tv-primary); background: var(--tv-primary-soft); }
  .st--none, .st--open { color: var(--tv-text-muted); background: var(--tv-muted-bg); }
  .score { display: inline-block; min-width: 36px; text-align: right; font-weight: 700; color: var(--tv-heading); }
  .score.low { color: var(--tv-danger); }
  .stu { display: flex; align-items: center; gap: 10px; min-width: 200px; cursor: pointer; text-align: left; }
  .stu b { font-weight: 600; color: var(--tv-primary); }
  .stu small { display: block; font-size: 12px; color: var(--tv-text-muted); }
  .stu .tv-avatar { background: none; }
  .dl2 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
  .dl2 div { padding: 10px 12px; border-radius: 10px; background: var(--tv-muted-bg); }
  .dl2 b { display: block; font-size: 18px; color: var(--tv-heading); }
  .dl2 span { font-size: 12px; color: var(--tv-text-muted); }
  .rowlist { display: grid; gap: 6px; }
  .rowlist > div { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--tv-divider); border-radius: 8px; font-size: 14px; }
  .rowlist > div > span:first-child { flex: 1; min-width: 0; }
  .rowlist small { color: var(--tv-text-muted); font-size: 12px; }
  .sec-title { margin: 16px 0 8px; font-weight: 600; color: var(--tv-heading); }
  .seg { display: inline-flex; gap: 6px; flex-wrap: wrap; }
  .seg button { height: 28px; padding: 0 12px; border: 1px solid var(--tv-border); border-radius: 14px; background: var(--tv-surface); font: 600 13px var(--tv-font); color: var(--tv-text-muted); cursor: pointer; }
  .seg button.is-on { border-color: var(--tv-primary); background: var(--tv-primary-soft); color: var(--tv-primary); }
  .tv-drawer-mask { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 400; }
  .tv-drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100vw); z-index: 401; background: var(--tv-surface); box-shadow: var(--tv-sh-pop); display: flex; flex-direction: column; }
  .tv-drawer__head { display: flex; align-items: flex-start; gap: 12px; padding: 18px 20px; border-bottom: 1px solid var(--tv-divider); }
  .tv-drawer__head h3 { margin: 0; font-size: 18px; color: var(--tv-heading); }
  .tv-drawer__body { padding: 20px; overflow: auto; flex: 1; }
  @media (max-width: 1100px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid2 { grid-template-columns: 1fr; } }
  @media (max-width: 600px) { .hbar { grid-template-columns: 120px minmax(0, 1fr) 40px; } .dl2 { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<header class="tv-header" style="height:72px">
  <div class="tv-header__inner" style="padding:0 24px">
    <a class="tv-icon-btn" href="02-app-sidebar-list.html" aria-label="Góc học tập" style="width:38px;height:38px"><i data-lucide="house"></i></a>
    <h1 style="font-size:24px;font-weight:600;color:var(--tv-heading)">Toán 10 · Tiến độ</h1>
    <div class="tv-header__actions" style="margin-left:auto">
      <select class="tv-select" id="role" aria-label="Vai trò (bản mẫu)"><option value="gv">Giáo viên bộ môn</option><option value="tt">Tổ trưởng</option><option value="ht">Hiệu trưởng</option></select>
      <button class="tv-icon-btn" data-tv-theme-toggle></button>
      <img class="tv-avatar" src="../assets/default-avatar.jpg" alt="">
    </div>
  </div>
</header>
<main style="padding:24px 24px 0" id="main"></main>
<div id="drawer"></div>
<div class="tip" id="tip" hidden></div>
<div id="toast" class="tv-fab__label" style="position:fixed;left:50%;bottom:32px;transform:translateX(-50%);z-index:500" hidden></div>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../tvet.js"></script>
<script>
(function () {
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }, $ = function (id) { return document.getElementById(id); };
  var icons = function () { if (window.lucide) lucide.createIcons(); };
  var toast = function (t) { var e = $('toast'); e.textContent = t; e.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { e.hidden = true; }, 2200); };

  /* ---------- Dữ liệu mô phỏng (sinh có hạt giống để lần nào mở cũng giống nhau) ---------- */
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  var HO = ['Nguyễn', 'Trần', 'Lê', 'Phạm', 'Hoàng', 'Vũ', 'Đặng', 'Bùi', 'Đỗ', 'Ngô', 'Dương', 'Lý'];
  var DEM = ['Văn', 'Thị', 'Minh', 'Đức', 'Thu', 'Ngọc', 'Quang', 'Hải', 'Thanh', 'Gia', 'Bảo', 'Khánh'];
  var TEN = ['An', 'Anh', 'Bình', 'Chi', 'Dũng', 'Giang', 'Hà', 'Hiếu', 'Hùng', 'Huyền', 'Khang', 'Lan', 'Linh', 'Long', 'Mai', 'Minh', 'Nam', 'Ngân', 'Phúc', 'Quân', 'Sơn', 'Tâm', 'Thảo', 'Trang', 'Tú', 'Vy', 'Yến', 'Khôi', 'Nhi', 'Đạt'];
  // Lớp học khoá Toán 10
  var CLASSES = [
    { id: '10A1', size: 42, teacher: 'Nguyễn Thị Lan', seed: 11 },
    { id: '10A2', size: 40, teacher: 'Nguyễn Thị Lan', seed: 12 },
    { id: '10A5', size: 41, teacher: 'Nguyễn Thị Lan', seed: 15 },
    { id: '10A3', size: 39, teacher: 'Trần Văn Minh', seed: 13 },
    { id: '10A4', size: 41, teacher: 'Hoàng Văn Nam', seed: 14 }
  ];
  // Bài giảng của khoá theo chương: [tên, nội dung, đã phát hành]
  var CHAPTERS = [
    { name: 'Chương I. Mệnh đề và tập hợp', lessons: [['Bài 1. Mệnh đề', '1 video · 1 tài liệu', 1], ['Bài 2. Tập hợp và các phép toán trên tập hợp', '1 video · 2 tài liệu', 1], ['Ôn tập chương I', '1 tài liệu', 1]] },
    { name: 'Chương II. Bất phương trình bậc nhất hai ẩn', lessons: [['Bài 3. Bất phương trình bậc nhất hai ẩn', '1 video · 1 tài liệu', 1], ['Bài 4. Hệ bất phương trình bậc nhất hai ẩn', '1 video · 1 tài liệu', 1], ['Ôn tập chương II', '1 tài liệu', 1]] },
    { name: 'Chương III. Hàm số bậc hai và đồ thị', lessons: [['Bài 5. Hàm số và đồ thị', '1 video · 1 tài liệu', 1], ['Bài 6. Hàm số bậc hai', '2 video · 1 tài liệu', 1], ['Bài 7. Dấu của tam thức bậc hai', '1 video · 2 tài liệu', 1], ['Ôn tập chương III', '1 tài liệu', 1]] },
    { name: 'Chương IV. Hệ thức lượng trong tam giác', lessons: [['Bài 1. Giá trị lượng giác của một góc từ 0° đến 180°', '1 video · 1 tài liệu', 1], ['Bài 2. Định lí côsin và định lí sin', '1 video · 2 tài liệu', 1], ['Bài 3. Giải tam giác và ứng dụng thực tế', '1 tài liệu · phát hành 09/11', 0], ['Ôn tập chương IV', 'phát hành 16/11', 0]] },
    { name: 'Chương V. Vectơ', lessons: [['Bài 8. Các khái niệm mở đầu', 'phát hành 23/11', 0], ['Bài 9. Tổng và hiệu của hai vectơ', 'phát hành 30/11', 0]] }
  ];
  var LESSONS = [];
  CHAPTERS.forEach(function (ch, ci) { ch.lessons.forEach(function (l) { LESSONS.push({ id: 'l' + LESSONS.length, ch: ci, name: l[0], meta: l[1], rel: !!l[2] }); }); });
  var RELEASED = LESSONS.filter(function (l) { return l.rel; });
  // Bài tập giao trong khoá; open: còn hạn
  var TASKS = [
    { id: 't1', name: 'Bài tập: Mệnh đề', type: 'Bài tập', due: '20/09' },
    { id: 't2', name: 'Kiểm tra 15 phút: Tập hợp', type: 'Kiểm tra', due: '27/09' },
    { id: 't3', name: 'Phiếu bài tập: Hàm số bậc hai', type: 'Bài tập', due: '11/10' },
    { id: 't4', name: 'Kiểm tra 15 phút: Hàm số bậc hai', type: 'Kiểm tra', due: '18/10' },
    { id: 't5', name: 'Kiểm tra giữa kỳ I (phòng máy)', type: 'Kiểm tra', due: '28/10' },
    { id: 't6', name: 'Bài tập: Định lí côsin và định lí sin', type: 'Bài tập', due: '06/11', open: true }
  ];
  var LSTATE = { done: 'Hoàn thành', doing: 'Đang học', none: 'Chưa học' };
  var TSTATE = { done: 'Đúng hạn', late: 'Nộp muộn', miss: 'Chưa nộp', open: 'Chưa làm' };

  function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
  function r1(x) { return Math.round(x * 10) / 10; }
  function makeClass(c) {
    var r = rng(c.seed * 977), list = [];
    for (var i = 0; i < c.size; i++) {
      var ab = clamp(7 + (r() + r() + r() - 1.5) * 3.2, 2.2, 9.9), en = clamp(0.4 + r() * 0.8 - (ab < 4.5 ? 0.3 : 0), 0, 1);
      var s = { id: c.id + '-' + (i + 1), cls: c.id, name: HO[Math.floor(r() * HO.length)] + ' ' + DEM[Math.floor(r() * DEM.length)] + ' ' + TEN[Math.floor(r() * TEN.length)], les: {}, task: {}, score: {}, watch: {}, idle: 0, minutes: 0 };
      RELEASED.forEach(function (l, k) {
        // bài cũ dễ hoàn thành hơn bài mới phát hành
        var age = 1 - k / RELEASED.length, x = r();
        s.les[l.id] = x < 0.5 + en * 0.35 + age * 0.2 ? 'done' : x < 0.75 + en * 0.25 ? 'doing' : 'none';
        s.watch[l.id] = s.les[l.id] === 'done' ? 100 : s.les[l.id] === 'doing' ? 20 + Math.round(r() * 60) : 0;
      });
      TASKS.forEach(function (t) {
        var x = r(), sc = r1(clamp(ab + (r() - 0.5) * 3, 0, 10));
        s.task[t.id] = t.open ? (x < 0.35 + en * 0.4 ? 'done' : 'open') : x > 0.86 + en * 0.14 ? 'miss' : x > 0.78 + en * 0.2 ? 'late' : 'done';
        if (s.task[t.id] === 'done' || s.task[t.id] === 'late') s.score[t.id] = sc;
      });
      s.idle = en < 0.3 ? 7 + Math.floor(r() * 9) : Math.floor(r() * 5);
      s.minutes = Math.round(200 + en * 900 + r() * 200);
      list.push(s);
    }
    return list;
  }
  var STUDENTS = {};
  CLASSES.forEach(function (c) { STUDENTS[c.id] = makeClass(c); });

  /* ---------- Chỉ số ---------- */
  function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }
  function avg(a) { return a.length ? a.reduce(function (x, y) { return x + y; }, 0) / a.length : null; }
  function fmt(x) { return x == null ? '—' : r1(x).toFixed(1).replace('.', ','); }
  function scoreHtml(x) { return x == null ? '<span class="score">—</span>' : '<span class="score' + (x < 5 ? ' low' : '') + '">' + fmt(x) + '</span>'; }
  function stuLessons(s) { return RELEASED.filter(function (l) { return s.les[l.id] === 'done'; }).length; }
  function stuChap(s, ci) { var L = RELEASED.filter(function (l) { return l.ch === ci; }); return L.length ? pct(L.filter(function (l) { return s.les[l.id] === 'done'; }).length, L.length) : null; }
  function stuTasks(s) { return TASKS.filter(function (t) { return s.score[t.id] != null; }).length; }
  function stuAvg(s) { return avg(TASKS.map(function (t) { return s.score[t.id]; }).filter(function (x) { return x != null; })); }
  function lessonStat(L, l) { var o = { done: 0, doing: 0, none: 0 }; L.forEach(function (s) { o[s.les[l.id]]++; }); o.watch = Math.round(L.reduce(function (a, s) { return a + s.watch[l.id]; }, 0) / L.length); return o; }
  function taskStat(L, t) {
    var o = { done: 0, late: 0, miss: 0, open: 0 }, sc = [];
    L.forEach(function (s) { o[s.task[t.id]]++; if (s.score[t.id] != null) sc.push(s.score[t.id]); });
    o.avg = avg(sc); o.low = sc.filter(function (x) { return x < 5; }).length; return o;
  }
  function classStats(id) {
    var L = STUDENTS[id], closed = TASKS.filter(function (t) { return !t.open; }), sub = 0, ontime = 0, sc = [];
    L.forEach(function (s) {
      closed.forEach(function (t) { var x = s.task[t.id]; if (x !== 'miss') sub++; if (x === 'done') ontime++; });
      TASKS.forEach(function (t) { if (s.score[t.id] != null) sc.push(s.score[t.id]); });
    });
    return { size: L.length, lessons: pct(L.reduce(function (a, s) { return a + stuLessons(s); }, 0), L.length * RELEASED.length), sub: pct(sub, L.length * closed.length), ontime: pct(ontime, L.length * closed.length), avg: avg(sc) };
  }

  /* ---------- Vai trò và phạm vi ---------- */
    function role() { return $('role').value; }
  function visibleClasses() {
    var r = role();
    if (r === 'gv') return CLASSES.filter(function (c) { return c.teacher === 'Nguyễn Thị Lan'; });
    if (r === 'tt' || r === 'ht') return CLASSES;
    return [];
  }

  var TABS = ['overview', 'lessons', 'tasks', 'students'];
  var S = { cls: null, tab: TABS.indexOf(location.hash.slice(1)) >= 0 ? location.hash.slice(1) : 'overview', q: '', sort: 'name', lf: 'all', drawer: null, chartTable: false };
  function cur() { return CLASSES.filter(function (c) { return c.id === S.cls; })[0]; }

  /* ---------- Giao diện ---------- */
  function render() {
    var vis = visibleClasses();
    
    if (!vis.some(function (c) { return c.id === S.cls; })) S.cls = vis[0].id;
    var html = '<div class="bar-top"><div class="tv-seg"><button onclick="location.href=\'../../lcms-design-system/templates/04-detail-chapters.html\'">Nội dung</button><button class="is-active">Tiến độ học</button></div><span style="flex:1"></span>' +
      '<label class="tv-small tv-muted" for="cls">Lớp</label><select class="tv-select" id="cls">' + vis.map(function (x) { return '<option value="' + x.id + '"' + (x.id === S.cls ? ' selected' : '') + '>' + x.id + (vis.length > 3 ? ' · ' + x.teacher : '') + '</option>'; }).join('') + '</select>' +
      '<select class="tv-select" aria-label="Kỳ"><option>Học kỳ I · 2026–2027</option></select>' +
      '<button class="tv-btn tv-btn--outline tv-btn--sm" data-act="export"><i data-lucide="sheet"></i>Xuất Excel</button></div>' +
      '<nav class="tv-htabs" style="padding:0;border:0;background:none;margin-bottom:16px">' + [['overview', 'Tổng quan'], ['lessons', 'Bài giảng'], ['tasks', 'Bài tập'], ['students', 'Theo học sinh']].map(function (t) { return '<a href="#" data-tab="' + t[0] + '" class="' + (S.tab === t[0] ? 'is-active' : '') + '">' + t[1] + '</a>'; }).join('') + '</nav>';
    html += S.tab === 'overview' ? viewOverview() : S.tab === 'lessons' ? viewLessons() : S.tab === 'tasks' ? viewTasks() : viewStudents();
    $('main').innerHTML = html;
    renderDrawer(); icons();
  }
  function table(head, rows, cls) {
    return '<div class="tv-table-wrap' + (cls ? ' ' + cls : '') + '"><table class="tv-table"><thead><tr>' + head.map(function (h, i) { return '<th' + (i ? ' class="c"' : '') + '>' + h + '</th>'; }).join('') + '</tr></thead><tbody>' +
      rows.join('') + '</tbody></table></div>';
  }
  function tr(cells, attrs) { return '<tr' + (attrs || '') + '>' + cells.map(function (v, i) { return '<td' + (i ? ' class="c"' : '') + '>' + v + '</td>'; }).join('') + '</tr>'; }
  function bar(v) { return '<div class="pcell"><span>' + v + '%</span><div class="tv-bar"><span style="width:' + v + '%"></span></div></div>'; }
  function hbars(items) {
    return '<div class="hbars">' + items.map(function (x) { return '<div class="hbar" data-tip="' + x.tip + '"><span>' + esc(x.label) + '</span><div class="track"><div class="fill" style="width:' + x.v + '%"></div></div><b>' + x.v + '%</b></div>'; }).join('') + '</div>';
  }

  function viewOverview() {
    var c = cur(), L = STUDENTS[c.id], st = classStats(c.id);
    var kpis = '<div class="kpis">' +
      '<div class="tv-panel kpi"><span>Hoàn thành bài giảng</span><b>' + st.lessons + '%</b><small>Trung bình lớp · ' + RELEASED.length + '/' + LESSONS.length + ' bài đã phát hành</small></div>' +
      '<div class="tv-panel kpi"><span>Bài tập đã nộp</span><b>' + st.sub + '%</b><small>Các bài đã hết hạn</small></div>' +
      '<div class="tv-panel kpi"><span>Nộp đúng hạn</span><b>' + st.ontime + '%</b><small>Các bài đã hết hạn</small></div>' +
      '<div class="tv-panel kpi"><span>Điểm trung bình bài tập</span><b>' + fmt(st.avg) + '</b><small>Các bài đã nộp</small></div></div>';
    var chap = CHAPTERS.map(function (ch, ci) {
      var rel = RELEASED.filter(function (l) { return l.ch === ci; });
      if (!rel.length) return null;
      var v = Math.round(L.reduce(function (a, s) { return a + stuChap(s, ci); }, 0) / L.length);
      return { label: ch.name.replace('Chương ', ''), v: v, tip: esc(ch.name) + '<br>Hoàn thành trung bình: ' + v + '%<br>Đã phát hành ' + rel.length + '/' + ch.lessons.length + ' bài' };
    }).filter(Boolean);
    var tasks = TASKS.map(function (t) {
      var o = taskStat(L, t), v = pct(o.done + o.late, L.length);
      return { label: t.name, v: v, avg: o.avg, tip: esc(t.name) + '<br>Đã nộp: ' + (o.done + o.late) + '/' + L.length + ' (nộp muộn ' + o.late + ')<br>' + (t.open ? 'Còn hạn đến ' + t.due + ', chưa làm ' + o.open : 'Chưa nộp: ' + o.miss) + '<br>Điểm TB: ' + fmt(o.avg) };
    });
    var tog = '<button class="linkbtn" data-act="chartTable">' + (S.chartTable ? 'Xem biểu đồ' : 'Xem dạng bảng') + '</button>';
    var chartChap = S.chartTable ? table(['Chương', 'Hoàn thành TB'], chap.map(function (x) { return tr([esc(x.label), x.v + '%']); })) : hbars(chap);
    var chartTask = S.chartTable ? table(['Bài tập', 'Đã nộp', 'Điểm TB'], tasks.map(function (x) { return tr([esc(x.label), x.v + '%', fmt(x.avg)]); })) : hbars(tasks);
    var vis = visibleClasses();
    var cmp = vis.length > 1 ? '<section class="tv-panel"><div class="card-h"><h3>So sánh các lớp ' + (role() === 'gv' ? 'tôi dạy' : 'học khoá này') + '</h3></div><div class="card-b">' +
      table(['Lớp', 'Giáo viên', 'Sĩ số', 'Hoàn thành bài giảng', 'Bài tập đã nộp', 'Nộp đúng hạn', 'Điểm TB bài tập'], vis.map(function (x) { var s = classStats(x.id); return tr(['<button class="linkbtn" data-cls="' + x.id + '">' + x.id + '</button>', esc(x.teacher), s.size, s.lessons + '%', s.sub + '%', s.ontime + '%', fmt(s.avg)]); })) + '</div></section>' : '';
    return kpis + '<div class="grid2"><section class="tv-panel"><div class="card-h"><h3>Hoàn thành bài giảng theo chương</h3>' + tog + '</div><div class="card-b">' + chartChap + '<p class="tv-small tv-muted" style="margin-top:10px">Chỉ tính các bài đã phát hành.</p></div></section>' +
      '<section class="tv-panel"><div class="card-h"><h3>Tỉ lệ nộp theo bài tập</h3>' + tog + '</div><div class="card-b">' + chartTask + '<p class="tv-small tv-muted" style="margin-top:10px">Rê chuột lên từng bài để xem điểm trung bình.</p></div></section></div>' + cmp;
  }

  function viewLessons() {
    var L = STUDENTS[S.cls], rows = [];
    CHAPTERS.forEach(function (ch, ci) {
      rows.push('<tr class="chap"><td colspan="6">' + esc(ch.name) + '</td></tr>');
      LESSONS.filter(function (l) { return l.ch === ci; }).forEach(function (l) {
        if (!l.rel) { rows.push(tr([esc(l.name) + '<div class="tv-small tv-muted">' + esc(l.meta) + '</div>', '—', '—', '—', '—', '<span class="st st--none">Chưa phát hành</span>'], ' class="unrel"')); return; }
        var o = lessonStat(L, l);
        rows.push(tr([esc(l.name) + '<div class="tv-small tv-muted">' + esc(l.meta) + '</div>', bar(pct(o.done, L.length)), o.done, o.doing, o.none, o.watch + '%'], ' class="click" data-lesson="' + l.id + '"'));
      });
    });
    return '<div class="tbl-tools"><span class="tv-muted" style="font-size:13px">Lớp ' + S.cls + ' · ' + L.length + ' học sinh · bấm một bài để xem từng học sinh</span></div>' +
      table(['Bài giảng', 'Hoàn thành', 'Hoàn thành (HS)', 'Đang học', 'Chưa học', 'Xem video TB'], rows);
  }
  function viewTasks() {
    var L = STUDENTS[S.cls];
    return '<div class="tbl-tools"><span class="tv-muted" style="font-size:13px">Lớp ' + S.cls + ' · ' + L.length + ' học sinh · bấm một bài để xem điểm từng học sinh</span></div>' +
      table(['Bài tập', 'Hạn nộp', 'Đã nộp', 'Đúng hạn', 'Nộp muộn', 'Chưa nộp', 'Điểm TB', 'Dưới 5'], TASKS.map(function (t) {
        var o = taskStat(L, t);
        return tr([esc(t.name) + '<div class="tv-small tv-muted">' + t.type + (t.open ? ' · đang mở' : '') + '</div>', t.due, bar(pct(o.done + o.late, L.length)), o.done, o.late, t.open ? o.open + ' <span class="tv-small tv-muted">(còn hạn)</span>' : o.miss, scoreHtml(o.avg), o.low], ' class="click" data-task="' + t.id + '"');
      }));
  }
  function stuCell(s) { return '<div class="stu" data-stu="' + s.id + '"><img class="tv-avatar" src="../assets/default-avatar.jpg" alt="" style="width:30px;height:30px"><div><b>' + esc(s.name) + '</b><small>' + s.cls + '</small></div></div>'; }
  function sortRows(rows) {
    var k = function (s) { var p = s.name.split(' '); return p[p.length - 1] + ' ' + s.name; };
    return rows.slice().sort(function (a, b) {
      if (S.sort === 'lesAsc') return stuLessons(a) - stuLessons(b);
      if (S.sort === 'taskAsc') return stuTasks(a) - stuTasks(b);
      if (S.sort === 'avgAsc') return (stuAvg(a) || 0) - (stuAvg(b) || 0);
      return k(a).localeCompare(k(b), 'vi');
    });
  }
  function viewStudents() {
    var q = S.q.toLowerCase(), rows = sortRows(STUDENTS[S.cls].filter(function (s) { return !q || s.name.toLowerCase().indexOf(q) >= 0; }));
    var chs = CHAPTERS.map(function (ch, ci) { return ci; }).filter(function (ci) { return RELEASED.some(function (l) { return l.ch === ci; }); });
    var SORTS = [['name', 'Theo tên'], ['lesAsc', 'Ít bài giảng hoàn thành trước'], ['taskAsc', 'Ít bài tập đã nộp trước'], ['avgAsc', 'Điểm TB bài tập thấp trước']];
    return '<div class="tbl-tools"><div class="tv-input tv-input--search"><input id="q" value="' + esc(S.q) + '" placeholder="Tìm học sinh…" aria-label="Tìm học sinh"></div>' +
      '<select class="tv-select" id="sort" style="width:230px" aria-label="Sắp xếp">' + SORTS.map(function (o) { return '<option value="' + o[0] + '"' + (S.sort === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select>' +
      '<span class="tv-spacer"></span><span class="tv-muted" style="font-size:13px">' + rows.length + ' học sinh</span></div>' +
      table(['Học sinh', 'Bài giảng hoàn thành', 'Bài tập đã nộp', 'Điểm TB bài tập'].concat(chs.map(function (ci) { return esc(CHAPTERS[ci].name.split('.')[0]); })).concat(['Thời lượng', 'Lần học gần nhất']), rows.map(function (s) {
        return tr([stuCell(s), stuLessons(s) + '/' + RELEASED.length, stuTasks(s) + '/' + TASKS.length, scoreHtml(stuAvg(s))].concat(chs.map(function (ci) { return '<span data-tip="' + esc(CHAPTERS[ci].name) + ': ' + stuChap(s, ci) + '%">' + bar(stuChap(s, ci)) + '</span>'; }))
          .concat([Math.floor(s.minutes / 60) + ' giờ ' + (s.minutes % 60) + ' phút', s.idle === 0 ? 'Hôm nay' : s.idle + ' ngày trước']));
      }), 'sticky');
  }

  /* ---------- Ngăn chi tiết: một bài giảng, một bài tập hoặc một học sinh ---------- */
  function find(id) { return STUDENTS[id.split('-')[0]].filter(function (s) { return s.id === id; })[0]; }
  function renderDrawer() {
    var d = S.drawer;
    if (!d) { $('drawer').innerHTML = ''; icons(); return; }
    var title, sub, body;
    if (d.lesson || d.task) {
      var L = STUDENTS[S.cls], isL = !!d.lesson, it = isL ? LESSONS.filter(function (l) { return l.id === d.lesson; })[0] : TASKS.filter(function (t) { return t.id === d.task; })[0];
      var key = isL ? 'les' : 'task', NAMES = isL ? LSTATE : TSTATE, o = isL ? lessonStat(L, it) : taskStat(L, it);
      var keys = Object.keys(NAMES).filter(function (k) { return isL || !(it.open ? k === 'miss' : k === 'open'); });
      var shown = L.filter(function (s) { return S.lf === 'all' || s[key][it.id] === S.lf; });
      if (!isL) shown = shown.slice().sort(function (a, b) { return (b.score[it.id] == null ? -1 : b.score[it.id]) - (a.score[it.id] == null ? -1 : a.score[it.id]); });
      title = esc(it.name); sub = 'Lớp ' + S.cls + (isL ? ' · ' + esc(it.meta) : ' · ' + it.type + ' · hạn ' + it.due);
      body = '<div class="dl2">' + (isL ? keys.map(function (k) { return '<div><b>' + o[k] + '</b><span>' + NAMES[k] + '</span></div>'; }).join('')
          : '<div><b>' + (o.done + o.late) + '/' + L.length + '</b><span>Đã nộp (muộn ' + o.late + ')</span></div><div><b>' + fmt(o.avg) + '</b><span>Điểm trung bình</span></div><div><b>' + o.low + '</b><span>Bài dưới 5 điểm</span></div>') + '</div>' +
        '<div class="seg" style="margin-bottom:10px"><button data-lf="all" class="' + (S.lf === 'all' ? 'is-on' : '') + '">Tất cả (' + L.length + ')</button>' + keys.map(function (k) { return '<button data-lf="' + k + '" class="' + (S.lf === k ? 'is-on' : '') + '">' + NAMES[k] + ' (' + o[k] + ')</button>'; }).join('') + '</div>' +
        '<div class="rowlist">' + shown.map(function (s) {
          var x = s[key][it.id];
          return '<div><span>' + esc(s.name) + (isL && x === 'doing' ? ' <small>· đã xem ' + s.watch[it.id] + '%</small>' : '') + '</span><span class="st st--' + x + '">' + NAMES[x] + '</span>' + (isL ? '' : scoreHtml(s.score[it.id])) + '</div>';
        }).join('') + '</div>';
    } else {
      var s = find(d.stu);
      title = esc(s.name); sub = s.cls;
      body = '<div class="dl2"><div><b>' + stuLessons(s) + '/' + RELEASED.length + '</b><span>Bài giảng hoàn thành</span></div><div><b>' + stuTasks(s) + '/' + TASKS.length + '</b><span>Bài tập đã nộp</span></div><div><b>' + fmt(stuAvg(s)) + '</b><span>Điểm TB bài tập</span></div></div>' +
        '<p class="tv-muted" style="font-size:13px;margin:-6px 0 12px">Lần học gần nhất: ' + (s.idle === 0 ? 'hôm nay' : s.idle + ' ngày trước') + ' · Thời lượng: ' + Math.floor(s.minutes / 60) + ' giờ ' + (s.minutes % 60) + ' phút</p>' +
        '<div class="sec-title">Bài tập</div><div class="rowlist">' + TASKS.map(function (t) { var x = s.task[t.id]; return '<div><span>' + esc(t.name) + '<br><small>' + t.type + ' · hạn ' + t.due + '</small></span><span class="st st--' + x + '">' + TSTATE[x] + '</span>' + scoreHtml(s.score[t.id]) + '</div>'; }).join('') + '</div>' +
        '<div class="sec-title">Bài giảng</div><div class="rowlist">' + RELEASED.map(function (l) { var x = s.les[l.id]; return '<div><span>' + esc(l.name) + '<br><small>' + esc(CHAPTERS[l.ch].name) + (x === 'doing' ? ' · đã xem ' + s.watch[l.id] + '%' : '') + '</small></span><span class="st st--' + x + '">' + LSTATE[x] + '</span></div>'; }).join('') + '</div>';
    }
    $('drawer').innerHTML = '<div class="tv-drawer-mask" data-act="closeDrawer"></div><aside class="tv-drawer" role="dialog" aria-label="Chi tiết"><div class="tv-drawer__head"><div style="flex:1"><h3>' + title + '</h3><div class="tv-small tv-muted">' + sub + '</div></div><button class="tv-icon-btn" data-act="closeDrawer" aria-label="Đóng"><i data-lucide="x"></i></button></div>' +
      '<div class="tv-drawer__body">' + body + '</div></aside>';
    icons();
  }

  function exportCsv() {
    var c = cur(), rows = [['STT', 'Học sinh', 'Lớp'].concat(RELEASED.map(function (l) { return l.name; })).concat(TASKS.map(function (t) { return t.name; })).concat(['Bài giảng hoàn thành', 'Bài tập đã nộp', 'Điểm TB bài tập'])];
    sortRows(STUDENTS[c.id]).forEach(function (s, i) {
      rows.push([i + 1, s.name, s.cls].concat(RELEASED.map(function (l) { return LSTATE[s.les[l.id]]; })).concat(TASKS.map(function (t) { return s.score[t.id] != null ? fmt(s.score[t.id]) + (s.task[t.id] === 'late' ? ' (muộn)' : '') : TSTATE[s.task[t.id]]; })).concat([stuLessons(s) + '/' + RELEASED.length, stuTasks(s) + '/' + TASKS.length, fmt(stuAvg(s))]));
    });
    var csv = '﻿' + rows.map(function (r) { return r.map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(','); }).join('\n');
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = 'tien-do-toan10-' + c.id + '.csv'; a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    toast('Đã xuất tiến độ lớp ' + c.id);
  }

  document.addEventListener('click', function (e) {
    var el;
    if ((el = e.target.closest('[data-tab]'))) { e.preventDefault(); S.tab = el.dataset.tab; history.replaceState(null, '', '#' + S.tab); return render(); }
    if ((el = e.target.closest('[data-cls]'))) { S.cls = el.dataset.cls; return render(); }
    if ((el = e.target.closest('[data-lf]'))) { S.lf = el.dataset.lf; return renderDrawer(); }
    if ((el = e.target.closest('[data-stu]'))) { S.drawer = { stu: el.dataset.stu }; return renderDrawer(); }
    if ((el = e.target.closest('[data-lesson]'))) { S.lf = 'all'; S.drawer = { lesson: el.dataset.lesson }; return renderDrawer(); }
    if ((el = e.target.closest('[data-task]'))) { S.lf = 'all'; S.drawer = { task: el.dataset.task }; return renderDrawer(); }
    if ((el = e.target.closest('[data-act]'))) {
      var a = el.dataset.act;
      if (a === 'closeDrawer') { S.drawer = null; renderDrawer(); }
      if (a === 'chartTable') { S.chartTable = !S.chartTable; render(); }
      if (a === 'export') exportCsv();
    }
  });
  document.addEventListener('input', function (e) {
    if (e.target.id !== 'q') return;
    S.q = e.target.value; var pos = e.target.selectionStart; render(); var q = $('q'); q.focus(); q.setSelectionRange(pos, pos);
  });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'cls') { S.cls = e.target.value; S.drawer = null; render(); }
    if (e.target.id === 'sort') { S.sort = e.target.value; render(); }
  });
  // Tooltip cho thanh biểu đồ và ô tiến độ
  document.addEventListener('mousemove', function (e) {
    var el = e.target.closest('[data-tip]'), tip = $('tip');
    if (!el) { tip.hidden = true; return; }
    tip.innerHTML = el.getAttribute('data-tip'); tip.hidden = false;
    var x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8), y = e.clientY + 16 + tip.offsetHeight > innerHeight ? e.clientY - tip.offsetHeight - 10 : e.clientY + 16;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.drawer) { S.drawer = null; renderDrawer(); } });
  $('role').addEventListener('change', function () { S.drawer = null; render(); });
  render();
})();
</script>
</body>
</html>
