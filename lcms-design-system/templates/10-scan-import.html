      key: { page: 1, text: 'Đáp án: 1.B   2.A   3.A   4. 1' }, keyNote: 'Đáp án lấy từ dòng “Đáp án” cuối đề',
      qs: [

        { type: 'mcq', stem: 'Cho tam giác $ABC$ có $AB = 5$, $AC = 8$ và $\\widehat{BAC} = 60^\\circ$. Độ dài cạnh $BC$ bằng', opts: ['$7$', 'V89', '$49$', '$\\sqrt{129}$'], correct: 0, issues: [{ f: 'opt1', found: 'V89', fix: '$\\sqrt{89}$', msg: 'Ký hiệu căn có thể bị đọc thành chữ “V”' }] },
        { type: 'short', stem: 'Trong mặt phẳng $Oxy$, cho $\\vec{a} = (1;2)$ và $\\vec{b} = (3;-1)$. Tính tích vô hướng $\\vec{a}\\cdot\\vec{b}$.', answer: '1' }
      ] },

      parts: [{ page: 1, title: 'PHẦN I. Câu trắc nghiệm nhiều phương án lựa chọn', qs: [0, 1, 2] }, { page: 2, title: 'PHẦN II. Câu trắc nghiệm đúng sai', qs: [3] }, { page: 2, title: 'PHẦN III. Câu trắc nghiệm trả lời ngắn', qs: [4] }],

        { type: 'mcq', stem: 'Cho $A = \\{1;2;3;4\\}$ và $B = \\{3;4;5\\}$. Tập hợp $A \\setminus B$ là', opts: ['$\\{3;4\\}$', '$\\{5\\}$', '$\\{1;2\\}$', '$\\{1;2;3;4;5\\}$'], correct: 2 },
        { type: 'mcq', stem: 'Cho hình bình hành $ABCD$. Vectơ $\\overrightarrow{AB} + \\overrightarrow{AD}$ bằng', opts: ['$\\overrightarrow{BD}$', '$\\overrightarrow{AC}$', '$\\overrightarrow{CA}$', '$\\overrightarrow{DB}$'], correct: 1 },
        { type: 'tf', stem: 'Cho hàm số $y = -x^2 + 2x + 3$ có đồ thị là parabol $(P)$.', stmts: [{ t: '$(P)$ có trục đối xứng là đường thẳng $x = 1$.', ok: true }, { t: 'Hàm số đồng biến trên khoảng $(-\\infty;1)$.', ok: true }, { t: 'Giá trị lớn nhất của hàm số bằng $3$.', ok: false }, { t: '$(P)$ cắt trục hoành tại hai điểm có hoành độ $-1$ và $3$.', ok: true }] },
        { type: 'short', stem: 'Cho tam giác $ABC$ có $BC = 2\\sqrt{3}$ và $\\widehat{BAC} = 60^\\circ$. Tính bán kính $R$ của đường tròn ngoại tiếp tam giác $ABC$.', answer: '2' }
      ] },

        { type: 'mcq', stem: 'Hàm số $y = x^2 - 2x$ nghịch biến trên khoảng', opts: ['$(1;+\\infty)$', '$(-\\infty;1)$', '$(-\\infty;2)$', '$(0;+\\infty)$'], correct: null, issues: [{ f: 'answer', msg: 'Đề không có đáp án. Chọn đáp án đúng:' }] },
        { type: 'mcq', stem: 'Parabol $y = x^2 + bx + c$ đi qua điểm $M(l;0)$ và có trục đối xứng là đường thẳng $x = 2$. Giá trị của $b + c$ bằng', opts: ['$-1$', '$1$', '$-7$', '$7$'], correct: null, issues: [{ f: 'stem', found: 'M(l;0)', fix: 'M(1;0)', msg: 'Ảnh mờ: chữ “l” có thể là số 1' }, { f: 'answer', msg: 'Đề không có đáp án. Chọn đáp án đúng:' }] }
      ] }

  // Nội dung thật trên ảnh = dữ liệu nhận dạng sau khi áp dụng các gợi ý sửa
  function truth(sample, i) {
    var q = clone(sample.qs[i]);
    (q.issues || []).forEach(function (is) {
      if (!is.found) return;
      if (is.f === 'stem') q.stem = q.stem.replace(is.found, is.fix);
      else if (is.f.indexOf('opt') === 0) q.opts[+is.f.slice(3)] = q.opts[+is.f.slice(3)].replace(is.found, is.fix);
    });
    return q;
  }

  var BANK_NAME = 'Toán 10 – Kho cá nhân';
  var bank = [
    { id: 'b1', type: 'mcq', stem: 'Cho $A = \\{1;2;3;4\\}$ và $B = \\{3;4;5\\}$. Tập hợp $A \\cap B$ là', opts: ['$\\{3;4\\}$', '$\\{1;2\\}$', '$\\{1;2;3;4;5\\}$', '$\\{5\\}$'], correct: 0, lab: { mach: KHUNG[1].mach, chude: KHUNG[1].chude, bai: KHUNG[1].bai, yccd: ['T10.TH.2'], level: 'Nhận biết' }, src: { kind: 'manual' }, created: '08:40 28/10/2026' },
    { id: 'b2', type: 'mcq', stem: 'Mệnh đề nào sau đây là mệnh đề đúng?', opts: ['$\\pi$ là số hữu tỉ', '$2$ là số nguyên tố chẵn duy nhất', '$\\sqrt{4}$ là số vô tỉ', 'Tổng hai số lẻ là số lẻ'], correct: 1, lab: { mach: KHUNG[0].mach, chude: KHUNG[0].chude, bai: KHUNG[0].bai, yccd: ['T10.MĐ.2'], level: 'Nhận biết' }, src: { kind: 'word', file: 'ngan-hang-chuong-1.xlsx' }, created: '15:20 29/10/2026' },

  function hasAnswer(q) { return q.type === 'mcq' ? q.correct != null : q.type === 'tf' ? q.stmts.every(function (s) { return s.ok === true || s.ok === false; }) : !!String(q.answer || '').trim(); }
  function openIssues(q) { return (q.issues || []).filter(function (is) { return is.f === 'answer' ? !hasAnswer(q) : !is.done; }); }
  function labeled(q) { return !!(q.lab && q.lab.bai); }
  function labelChips(q) {
    if (!labeled(q)) return '<span class="lc-chip-label lc-chip-label--warn">Chưa gán nhãn</span>';

        var sm = SAMPLES[e.sample], st = STEPS(sm), pct = e.phase === 'done' ? 100 : Math.round(e.step / st.length * 100);
        body = '<div class="lc-file"><span class="lc-thumb lc-thumb--' + (sm.thumb === 'PDF' ? 'pdf' : 'doc') + '" style="width:40px;height:40px;font-size:10px">' + sm.thumb + '</span><div><b style="cursor:default">' + esc(sm.name) + '</b><small>' + sm.size + ' · ' + sm.pages + ' trang → ' + esc(e.target) + '</small></div></div>' +
          '<div class="lc-progress"><span style="width:' + pct + '%"></span></div><ol class="lc-steplist">' + st.map(function (s, k) { var c = e.phase === 'done' || k < e.step ? 'is-done' : k === e.step ? 'is-run' : ''; return '<li class="' + c + '"><span class="s">' + (c === 'is-done' ? '✓' : '') + '</span>' + s + '</li>'; }).join('') + '</ol>' +
          (e.phase === 'done' ? '<div class="lc-callout" style="font-size:13px">Đã tách <b>' + sm.qs.length + ' câu hỏi</b> trong ' + sm.secs + ' giây. ' + (sm.qs.some(function (q) { return q.issues; }) ? 'Có câu cần giáo viên kiểm tra lại.' : '') + '</div>' : '<p class="lc-caption">Có thể đóng popup, quá trình vẫn tiếp tục. Biểu tượng tiện ích hiện ✓ khi xong.</p>');
        foot = e.phase === 'done' ? '<button class="lc-btn lc-btn--outline" data-action="extReset">Quét tệp khác</button><button class="lc-btn lc-btn--primary" data-action="extOpenResult">Mở kết quả trong LCMS</button>' : '<button class="lc-btn lc-btn--outline" data-action="extCancel">Huỷ</button>';
      }
    } else if (e.tab === 'history') {
      body = S.history.map(function (h) { return '<div class="lc-sample" style="cursor:default"><span class="lc-thumb lc-thumb--' + (/\.pdf$/.test(h.name) ? 'pdf' : 'doc') + '">' + (/\.pdf$/.test(h.name) ? 'PDF' : 'JPG') + '</span><div><b>' + esc(h.name) + '</b><small>' + h.when + ' · ' + h.n + ' câu đã nhập</small></div></div>'; }).join('');
    } else {
      body = '<div class="lc-field"><label class="lc-label" style="font-size:14px" for="extSvc">Dịch vụ nhận dạng</label><select class="lc-select" id="extSvc" style="height:36px" data-change="extSvc"><option' + (e.service === 'AI OCR (mặc định)' ? ' selected' : '') + '>AI OCR (mặc định)</option><option' + (e.service !== 'AI OCR (mặc định)' ? ' selected' : '') + '>OCR dự phòng</option></select><span class="lc-caption">Dịch vụ AI tách rời khỏi LCMS, có thể thay hoặc nâng cấp mà không ảnh hưởng hệ thống chính.</span></div>' +
        '<div class="lc-row" style="font-size:13px"><span class="lc-source lc-source--so">● Đang kết nối</span><span class="lc-caption">Phản hồi 120 ms</span></div>' +
        '<div><div class="lc-row" style="justify-content:space-between;font-size:13px;margin-bottom:6px"><span>Hạn mức hôm nay</span><b>37 / 200 trang</b></div><div class="lc-progress"><span style="width:18.5%"></span></div></div>' +
        '<label class="lc-switch" style="font-size:13px"><input type="checkbox" data-change="extOpt" data-k="autoOpen"' + (e.autoOpen ? ' checked' : '') + '>Tự mở kết quả trong LCMS khi xử lý xong</label>' +
        '<p class="lc-caption">Phiên bản tiện ích 1.2.0 · đăng nhập bằng tài khoản LCMS</p>';
    }
    el.innerHTML = '<div class="lc-ext__head"><img src="../assets/favicon_bn.png" alt=""><div><b>Quét đề LCMS</b><span>Nguyễn Thị Lan · đã đăng nhập</span></div><button class="lc-modal__close" data-action="extClose" style="margin-left:auto;color:#fff" aria-label="Đóng">×</button></div>' +
      '<div class="lc-ext__tabs">' + [['scan', 'Quét đề'], ['history', 'Lịch sử'], ['settings', 'Cài đặt']].map(function (t) { return '<button class="' + (e.tab === t[0] ? 'is-active' : '') + '" data-action="extTab" data-v="' + t[0] + '">' + t[1] + '</button>'; }).join('') + '</div>' +
      '<div class="lc-ext__body">' + body + '</div>' + (foot ? '<div class="lc-ext__foot">' + foot + '</div>' : '');
  }
  var timer = null;
  function runExt() {
    var e = S.ext, sm = SAMPLES[e.sample], dur = [600, 700, 1300, 800];
    e.phase = 'processing'; e.step = 0; renderExt();
    (function tick() {
      timer = setTimeout(function () {
        e.step++;
        if (e.step >= STEPS(sm).length) {
          e.phase = 'done';
          if (e.autoOpen) { e.open = false; openResult(); } else renderExt();
          return;
        }
        renderExt(); tick();
      }, dur[e.step]);
    })();
  }
  function openResult() {
    var sm = SAMPLES[S.ext.sample], pageOf = {};
    sm.parts.forEach(function (p) { p.qs.forEach(function (i) { pageOf[i] = p.page; }); });
    var qs = clone(sm.qs).map(function (q, i) {
      q.page = pageOf[i]; q.inc = true; q.lab = null;
      if (q.type === 'tf') q.stmts = q.stmts.map(function (s) { return { t: s.t, ok: s.ok }; });
      return q;
    });
    S.rv = { sample: sm.id, qs: qs, sel: 0, edit: null, page: 1, zoom: 1, straight: !!sm.tilt && S.ext.deskew, bulk: { mach: '', chude: '', bai: '', yccd: '', level: '' } };
    S.view = 'review'; S.drawerId = null; render();
    toast('Đã nhận kết quả từ tiện ích: ' + qs.length + ' câu hỏi');
  }

  // ---------- Modal Word/Excel (UC100) ----------
  var WORD_ROWS = [
    { type: 'mcq', stem: 'Cho $A = (-1;3]$ và $B = [0;5)$. Tập hợp $A \\cap B$ là', opts: ['$[0;3]$', '$(-1;5)$', '$[0;3)$', '$(-1;0)$'], correct: 0, bai: KHUNG[1].bai, yccd: 'T10.TH.2' },
    { type: 'mcq', stem: 'Tọa độ đỉnh của parabol $y = -x^2 + 4x$ là', opts: ['$(2;4)$', '$(-2;-12)$', '$(2;-4)$', '$(4;0)$'], correct: 0, bai: KHUNG[2].bai, yccd: 'T10.HS.3' },
    { type: 'short', stem: 'Cho tam giác $ABC$ có $a = 3$, $b = 4$, $\\widehat{C} = 90^\\circ$. Tính $c$.', answer: '5', bai: KHUNG[3].bai, yccd: 'T10.GT.1' }
  ];
  function renderWord() {
    var w = S.word;
    $('mWordBody').innerHTML = '<div class="lc-callout">So với quét đề: nhập từ Word/Excel cần soạn đúng <b>tệp mẫu của hệ thống</b> (mỗi câu một dòng hoặc một khối, có cột đáp án và nhãn). Quét đề dùng thẳng ảnh hoặc PDF có sẵn, AI tách câu hỏi và giáo viên duyệt lại.</div>' +
      '<div class="lc-row" style="flex-wrap:wrap"><b>Bước 1.</b> Tải tệp mẫu: <a href="#" data-action="wordTpl">mau-cau-hoi.docx</a> · <a href="#" data-action="wordTpl">mau-cau-hoi.xlsx</a></div>' +
      '<div><b>Bước 2.</b> Chọn tệp đã soạn</div>' +
      (w.file ? '<div class="lc-file" style="padding:10px;border:1px solid var(--lc-border-input);border-radius:10px"><span class="lc-thumb lc-thumb--q" style="width:40px;height:40px;font-size:10px">XLSX</span><div><b style="cursor:default">' + esc(w.file) + '</b><small>Đọc được ' + WORD_ROWS.length + ' câu · 0 lỗi định dạng</small></div></div>' +
        '<div><b>Bước 3.</b> Kiểm tra trước khi nhập</div><div class="lc-table-wrap"><table class="lc-table lc-table--plain"><thead><tr><th>#</th><th>Nội dung</th><th>Dạng</th><th>Đáp án</th><th>Nhãn</th></tr></thead><tbody>' +
          WORD_ROWS.map(function (r, k) { return '<tr><td>' + (k + 1) + '</td><td><div class="stem-clamp" style="max-width:300px">' + tex(r.stem) + '</div></td><td style="white-space:nowrap">' + TYPE_NAME[r.type] + '</td><td>' + (r.type === 'mcq' ? 'ABCD'[r.correct] : tex(r.answer)) + '</td><td><span class="lc-chip-label">' + r.yccd + '</span></td></tr>'; }).join('') + '</tbody></table></div>'
        : '<label class="lc-dropzone" style="min-height:120px"><img src="../assets/upload-img.svg" alt=""><b>Chọn tệp .docx hoặc .xlsx</b><input type="file" hidden accept=".docx,.xlsx" data-change="wordFile"></label><p class="lc-caption" style="text-align:center">Bản mẫu: <a href="#" data-action="wordSample">dùng tệp ngan-hang-mau.xlsx</a></p>');
    $('wordImportBtn').disabled = !w.file;
    $('wordImportBtn').textContent = w.file ? 'Nhập ' + WORD_ROWS.length + ' câu vào ngân hàng' : 'Nhập vào ngân hàng';
  }

  // ---------- Drawer chi tiết câu hỏi ----------
  function renderDrawer() {
    var q = S.drawerId && bank.filter(function (x) { return x.id === S.drawerId; })[0];
    if (!q) { $('drawerRoot').innerHTML = ''; return; }
    var l = q.lab || {}, src = q.src.kind === 'scan' ? 'Quét từ <b>' + esc(q.src.file) + '</b>, trang ' + q.src.page : q.src.kind === 'word' ? 'Nhập từ tệp ' + esc(q.src.file || 'Word/Excel') : 'Soạn trực tiếp trên hệ thống';
    $('drawerRoot').innerHTML = '<div class="lc-drawer-mask" data-action="closeDrawer"></div><aside class="lc-drawer" role="dialog" aria-label="Chi tiết câu hỏi"><div class="lc-drawer__head"><span class="lc-thumb lc-thumb--q" style="width:44px;height:44px;font-size:18px">?</span><div style="flex:1"><h3>' + TYPE_NAME[q.type] + '</h3><div style="margin-top:6px">' + sourceChip(q) + '</div></div><button class="lc-modal__close" data-action="closeDrawer" aria-label="Đóng">×</button></div>' +
      '<div class="lc-drawer__body"><div class="lc-qprev"><div class="stem">' + tex(q.stem) + '</div>' + answerHtml(q) + '</div><h4 class="lc-sec-title">Nhãn</h4>' +
      (labeled(q) ? '<dl class="lc-dl"><dt>Môn · Lớp</dt><dd>Toán · Lớp 10</dd><dt>Chủ đề</dt><dd>' + esc(l.chude) + '</dd><dt>Bài</dt><dd>' + esc(l.bai) + '</dd><dt>Yêu cầu cần đạt</dt><dd>' + esc((l.yccd || []).join(', ') || '—') + '</dd><dt>Mức độ</dt><dd>' + esc(l.level || '—') + '</dd></dl>' : '<div class="lc-callout lc-callout--warn">Chưa gán nhãn theo khung chương trình.</div>') +
      '<h4 class="lc-sec-title">Nguồn</h4><p>' + src + '</p><p class="lc-caption" style="margin-top:4px">Tạo lúc ' + q.created + '</p></div><div class="lc-drawer__foot"><button class="lc-btn lc-btn--outline" data-action="closeDrawer">Đóng</button><a class="lc-btn lc-btn--primary" href="09-content-approval.html">Đề xuất lên kho dùng chung</a></div></aside>';
  }

  // ---------- Render ----------
  function render() {
    var keep = S.view === S.lastView ? $('main').scrollTop : 0, out = S.view === 'review' ? viewReview() : viewBank();
    $('pageTitle').textContent = out.title;
    $('main').innerHTML = out.html; $('foot').innerHTML = out.foot; $('foot').hidden = !out.foot;
    $('main').scrollTop = keep; S.lastView = S.view;
    renderDrawer(); renderExt();
  }
  function rerenderReview() { var keep = $('main').scrollTop, out = viewReview(); $('main').innerHTML = out.html; $('foot').innerHTML = out.foot; $('main').scrollTop = keep; }
  function setSel(i, scrollCard) {
    var rv = S.rv; rv.sel = i;
    if (rv.qs[i].page !== rv.page) { rv.page = rv.qs[i].page; $('viewer').innerHTML = viewerHtml(); }
    document.querySelectorAll('.lc-scan__q').forEach(function (el) { el.classList.toggle('is-sel', +el.dataset.i === i); });
    document.querySelectorAll('.lc-ocr').forEach(function (el) { el.classList.toggle('is-sel', +el.dataset.i === i); });
    var region = document.querySelector('.lc-scan__q[data-i="' + i + '"]'), card = $('ocr' + i);
    if (region) region.scrollIntoView({ block: 'nearest' });
    if (scrollCard && card) card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  function toast(msg, warn) { var t = $('toast'); t.innerHTML = '<span class="ok"' + (warn ? ' style="color:var(--lc-warning)"' : '') + '>' + (warn ? '!' : '✓') + '</span>' + msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(function () { t.hidden = true; }, 2800); }

  // ---------- Sự kiện ----------
  $('extIcon').addEventListener('click', function (ev) { ev.stopPropagation(); S.ext.open = !S.ext.open; renderExt(); });
  document.addEventListener('click', function (ev) {
    // Popup tiện ích đóng khi bấm ra ngoài, giống Chrome; quá trình xử lý vẫn chạy tiếp
    if (S.ext.open && !ev.target.closest('#ext') && !ev.target.closest('[data-action="openExt"]')) { S.ext.open = false; renderExt(); }
    var el = ev.target.closest('[data-action]'); if (!el) return;
    var a = el.dataset.action, i = +el.dataset.i, rv = S.rv, q = rv && rv.qs[i];
    if (a === 'selq' && ev.target.closest('input,textarea,select,label,button')) return;
    if (el.tagName === 'A' && el.getAttribute('href') === '#') ev.preventDefault();
    switch (a) {
      case 'clearBankFilter': S.bankType = 'all'; S.bankBai = S.bankLevel = S.bankSrc = ''; render(); break;
      case 'goBank': S.view = 'bank'; render(); break;
      case 'open': S.drawerId = el.dataset.id; renderDrawer(); break;
      case 'closeDrawer': S.drawerId = null; renderDrawer(); break;
      case 'newQ': toast('Soạn câu hỏi trực tiếp: xem template 09 (Tạo câu hỏi)'); break;
      case 'openExt': $('importMenu') && ($('importMenu').hidden = true); S.ext.open = true; S.ext.tab = 'scan'; renderExt(); break;
      case 'openWord': $('importMenu').hidden = true; S.word = { file: null }; renderWord(); $('mWord').hidden = false; break;
      case 'extClose': S.ext.open = false; renderExt(); break;
      case 'extTab': S.ext.tab = el.dataset.v; renderExt(); break;
      case 'extSample': S.ext.sample = el.dataset.v; S.ext.file = null; S.ext.note = ''; renderExt(); break;
      case 'extCapture': case 'extPaste': S.ext.note = 'Bản mẫu: chụp vùng màn hình và dán ảnh cần tiện ích thật. Hãy chọn một tệp mẫu bên dưới.'; renderExt(); break;
      case 'extRun':
        if (S.ext.file) { S.ext.note = 'Bản mẫu chưa kết nối dịch vụ nhận dạng nên không xử lý được tệp <b>' + esc(S.ext.file) + '</b>. Hãy chọn một trong 3 tệp mẫu.'; S.ext.file = null; renderExt(); break; }
        runExt(); break;
      case 'extCancel': clearTimeout(timer); S.ext.phase = 'idle'; renderExt(); break;
      case 'extReset': S.ext.phase = 'idle'; renderExt(); break;
      case 'extOpenResult': S.ext.open = false; openResult(); break;
      case 'selq': setSel(i, !ev.target.closest('.lc-ocr')); break;
      case 'page': rv.page = +el.dataset.v; $('viewer').innerHTML = viewerHtml(); break;
      case 'zoom': rv.zoom = Math.min(1.6, Math.max(0.6, Math.round((rv.zoom + 0.1 * +el.dataset.v) * 10) / 10)); $('viewer').innerHTML = viewerHtml(); break;
      case 'straight': rv.straight = el.dataset.v === '1'; $('viewer').innerHTML = viewerHtml(); break;
      case 'editq': rv.edit = i; rv.sel = i; rerenderReview(); break;
      case 'doneq': rv.edit = null; q.touched = true; rerenderReview(); break;
      case 'fix': {
        var is = q.issues[+el.dataset.k];
        if (is.f === 'stem') q.stem = q.stem.replace(is.found, is.fix); else q.opts[+is.f.slice(3)] = q.opts[+is.f.slice(3)].replace(is.found, is.fix);
        is.done = true; q.touched = true; rerenderReview(); toast('Đã sửa câu ' + (i + 1) + ' theo gợi ý'); break;
      }
      case 'pickAns': q.correct = +el.dataset.v; q.touched = true; rerenderReview(); break;
      case 'applyBulk': {
        var b = rv.bulk, k = KHUNG.filter(function (x) { return x.bai === b.bai; })[0], n = 0;
        rv.qs.forEach(function (x) { if (x.inc) { x.lab = { mach: k.mach, chude: k.chude, bai: k.bai, yccd: b.yccd ? [b.yccd] : [], level: b.level }; n++; } });
        rerenderReview(); toast('Đã gán nhãn cho ' + n + ' câu'); break;
      }
      case 'import': {
        var inc = rv.qs.filter(function (x) { return x.inc; }), miss = inc.filter(function (x) { return !hasAnswer(x); })[0];
        if (miss) { toast('Câu ' + (rv.qs.indexOf(miss) + 1) + ' chưa có đáp án. Chọn đáp án trước khi nhập.', true); setSel(rv.qs.indexOf(miss), true); break; }
        var sm = SAMPLES[rv.sample], ids = [], t = now();
        inc.forEach(function (x) {
          var id = 's' + (++seq); ids.push(id);
          bank.unshift({ id: id, type: x.type, stem: x.stem, opts: x.opts, correct: x.correct, stmts: x.stmts, answer: x.answer, lab: x.lab, src: { kind: 'scan', file: sm.name, page: x.page }, created: t });
        });
        S.history.unshift({ name: sm.name, when: t, n: inc.length });
        S.highlight = ids; S.view = 'bank'; S.bankType = 'all'; S.ext.phase = 'idle'; render();
        toast('Đã nhập ' + inc.length + ' câu vào «' + esc(S.ext.target) + '»'); break;
      }
      case 'wordTpl': toast('Bản mẫu: tải tệp mẫu Word/Excel'); break;
      case 'wordSample': S.word.file = 'ngan-hang-mau.xlsx'; renderWord(); break;
      case 'wordImport': {
        var tw = now(), wids = [];
        WORD_ROWS.forEach(function (r) { var k2 = KHUNG.filter(function (x) { return x.bai === r.bai; })[0], id = 'w' + (++seq); wids.push(id); bank.unshift({ id: id, type: r.type, stem: r.stem, opts: r.opts, correct: r.correct, answer: r.answer, lab: { mach: k2.mach, chude: k2.chude, bai: k2.bai, yccd: [r.yccd], level: '' }, src: { kind: 'word', file: S.word.file }, created: tw }); });
        $('mWord').hidden = true; S.highlight = wids; S.view = 'bank'; render(); toast('Đã nhập ' + WORD_ROWS.length + ' câu từ ' + S.word.file); break;
      }
    }
  });
  document.addEventListener('change', function (ev) {
    var t = ev.target, k = t.dataset.change, rv = S.rv, i = +t.dataset.i; if (!k) return;
    var e = S.ext;
    switch (k) {
      case 'bankType': S.bankType = t.value; render(); return;
      case 'bankFilter': S[t.dataset.k] = t.value; render(); return;
      case 'extFile': if (t.files.length) { e.file = t.files[0].name; e.note = 'Đã chọn <b>' + esc(e.file) + '</b>.'; renderExt(); } return;
      case 'extTarget': e.target = t.value; return;
      case 'extOpt': e[t.dataset.k] = t.checked; return;
      case 'extSvc': e.service = t.value; return;
      case 'wordFile': if (t.files.length) { S.word.file = t.files[0].name; renderWord(); } return;
      case 'inc': rv.qs[i].inc = t.checked; rerenderReview(); return;
      case 'incAll': rv.qs.forEach(function (q) { q.inc = t.checked; }); rerenderReview(); return;
      case 'e.correct': rv.qs[i].correct = +t.value; return;
      case 'e.stmtOk': rv.qs[i].stmts[+t.dataset.k].ok = t.value === '' ? null : t.value === '1'; return;
      case 'e.type': {
        var q = rv.qs[i]; q.type = t.value;
        if (q.type === 'mcq' && !q.opts) { q.opts = ['', '', '', '']; q.correct = null; }
        if (q.type === 'tf' && !q.stmts) q.stmts = [{ t: '', ok: null }, { t: '', ok: null }, { t: '', ok: null }, { t: '', ok: null }];
        rerenderReview(); return;
      }
    }
    if (k.indexOf('b.') === 0) {
      var key = k.slice(2), b = rv.bulk, order = ['mach', 'chude', 'bai', 'yccd'], p = order.indexOf(key);
      b[key] = t.value; if (p >= 0) order.slice(p + 1).forEach(function (o) { b[o] = ''; });
      $('bulk').innerHTML = bulkHtml();
    }
  });
  document.addEventListener('input', function (ev) {
    var t = ev.target, k = t.dataset.input; if (!k) return;
    if (k === 'bankQ') { S.bankQ = t.value; $('bankTable').innerHTML = bankTable(); $('bankCount').textContent = bankRows().length + ' / ' + bank.length + ' câu'; return; }
    var q = S.rv && S.rv.qs[+t.dataset.i]; if (!q) return;
    if (k === 'e.stem') { q.stem = t.value; var pv = $('prev' + t.dataset.i); if (pv) pv.innerHTML = tex(q.stem); }
    else if (k === 'e.opt') q.opts[+t.dataset.k] = t.value;
    else if (k === 'e.stmt') q.stmts[+t.dataset.k].t = t.value;
    else if (k === 'e.answer') q.answer = t.value;
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Escape') return;
    if (S.ext.open) { S.ext.open = false; renderExt(); return; }
    if (S.drawerId && !document.querySelector('.lc-overlay:not([hidden])')) { S.drawerId = null; renderDrawer(); }
  }, true);

  render();
})();
</script>
