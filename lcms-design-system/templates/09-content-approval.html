<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LCMS · Gán nhãn và duyệt kho dùng chung</title>
<link rel="icon" href="../assets/favicon_bn.png">
<link rel="stylesheet" href="../lcms.css">
<style>
  .shared-grid { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 24px; align-items: start; }
  .review-grid { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 24px; align-items: start; }
  .label-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 24px; }
  .icon-btn-plain { border: 0; background: none; padding: 0; cursor: pointer; display: inline-grid; place-items: center; }
  .icon-btn-plain:disabled { opacity: .3; cursor: not-allowed; }
  .lc-menu__item .badge { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: #ff4d4f; color: #fff; font-size: 12px; line-height: 20px; text-align: center; }
  .lc-layout.is-collapsed .lc-menu__item .badge { display: none; }
  .lc-mcard__foot { display: flex; justify-content: flex-end; margin-top: auto; }
  .as-cls { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .as-cls label { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border: 1px solid var(--lc-divider); border-radius: 10px; cursor: pointer; font-size: 14px; }
  .as-cls label:has(input:checked) { border-color: var(--lc-primary); background: var(--lc-primary-soft); }
  .as-cls input { accent-color: var(--lc-primary); }
  .as-cls small { display: block; font-size: 12px; color: var(--lc-text-secondary); }
  .cfg-table { table-layout: fixed; }
  .cfg-table td { padding: 8px; }
  .cfg-table .lc-input, .cfg-table .lc-select { width: 100%; }
  .lc-header .lc-page-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (max-width: 1100px) { .shared-grid, .review-grid, .label-grid { grid-template-columns: 1fr; } .lc-filter { position: static; } }
  @media (max-width: 760px) {
    .lc-role-switch > span, .lc-user > div { display: none; }
    .lc-header { gap: 8px; }
    .lc-header .lc-page-title { font-size: 16px; }
    .lc-header__actions { gap: 8px; }
    .lc-role-switch { padding: 2px; }
    .lc-role-switch select { max-width: 120px; }
  }
</style>
</head>
<body>
<div class="lc-layout">
  <aside class="lc-sider">
    <div class="lc-sider__logo"><img src="../assets/logo_bn.png" alt="Giáo dục và Đào tạo Bắc Ninh"></div>
    <nav class="lc-menu lc-menu--grouped" id="menu"></nav>
  </aside>

  <div class="lc-main">
    <header class="lc-header">
      <button class="lc-burger" data-lc-collapse aria-label="Thu gọn menu"><img src="../assets/icons/menu.svg" alt=""></button>
      <h1 class="lc-page-title" id="pageTitle"></h1>
      <div class="lc-header__actions">
        <label class="lc-role-switch" title="Chỉ có trong bản mẫu: chuyển vai trò thay cho 4 cửa sổ trình duyệt khi demo"><span>Vai trò (bản mẫu)</span><select id="roleSel"></select></label>
        <div style="position:relative">
          <button class="lc-bell" data-lc-toggle="notif" aria-label="Thông báo"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5-6.7V3.5a2 2 0 1 0-4 0v.8A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2Z"/></svg><span class="count" id="bellCount" hidden></span></button>
          <div class="lc-notif" id="notif" data-lc-pop hidden></div>
        </div>
        <div class="lc-user"><img class="lc-avatar" src="../assets/default-avatar.jpg" alt=""><div><b id="userName"></b><span id="userTitle"></span></div></div>
      </div>
    </header>
    <main class="lc-content lc-content--soft" id="main"></main>
    <footer class="lc-footer" id="foot"></footer>
  </div>
</div>

<div id="drawerRoot"></div>

<!-- Modal: tạo mới học liệu & gán nhãn -->
<div class="lc-overlay" id="mLabel" hidden>
  <div class="lc-modal lc-modal--lg" role="dialog" aria-labelledby="mLabelTitle" style="max-width:1100px">
    <div class="lc-modal__head"><h3 id="mLabelTitle">Gán nhãn học liệu</h3><button class="lc-modal__close" data-lc-close aria-label="Đóng">×</button></div>
    <div class="lc-modal__body" id="mLabelBody"></div>
    <div class="lc-modal__foot"><button class="lc-btn lc-btn--outline" data-lc-close>Huỷ</button><button class="lc-btn lc-btn--outline" data-action="saveLabel">Lưu nhãn</button><button class="lc-btn lc-btn--primary" data-action="saveLabelSubmit">Lưu &amp; gửi duyệt</button></div>
  </div>
</div>

<!-- Modal: gửi duyệt -->
<div class="lc-overlay" id="mSubmit" hidden>
  <div class="lc-modal" role="dialog" aria-labelledby="mSubmitTitle" style="max-width:600px">
    <div class="lc-modal__head"><h3 id="mSubmitTitle">Gửi duyệt lên kho dùng chung</h3><button class="lc-modal__close" data-lc-close aria-label="Đóng">×</button></div>
    <div class="lc-modal__body" id="mSubmitBody"></div>
    <div class="lc-modal__foot"><button class="lc-btn lc-btn--outline" data-lc-close>Huỷ</button><button class="lc-btn lc-btn--primary" data-action="doSubmit">Gửi duyệt</button></div>
  </div>
</div>

<!-- Modal: từ chối -->
<div class="lc-overlay" id="mReject" hidden>
  <div class="lc-modal" role="dialog" aria-labelledby="mRejectTitle" style="max-width:520px">
    <div class="lc-modal__head"><h3 id="mRejectTitle">Từ chối và gửi lý do cho giáo viên</h3><button class="lc-modal__close" data-lc-close aria-label="Đóng">×</button></div>
    <div class="lc-modal__body lc-stack" style="gap:14px">
      <div class="lc-field"><label class="lc-label" for="rejReason">Lý do<span class="req">*</span></label>
        <select class="lc-select" id="rejReason" style="height:40px"><option>Gán nhãn chưa đúng khung chương trình</option><option>Nội dung chưa chính xác</option><option>Chất lượng hình ảnh, âm thanh chưa đạt</option><option>Trùng với học liệu đã có trong kho</option><option>Có câu hỏi sai đáp án hoặc lỗi đề</option><option>Chưa rõ bản quyền nội dung</option><option>Khác</option></select></div>
      <div class="lc-field"><label class="lc-label" for="rejDetail">Góp ý chi tiết<span class="req" id="rejReq">*</span></label><textarea class="lc-textarea" id="rejDetail" rows="4" placeholder="Nêu rõ chỗ cần chỉnh để giáo viên sửa và gửi lại"></textarea><span class="lc-err" id="rejErr" hidden>Vui lòng nhập góp ý chi tiết.</span></div>
    </div>
    <div class="lc-modal__foot"><button class="lc-btn lc-btn--outline" data-lc-close>Huỷ</button><button class="lc-btn lc-btn--danger" data-action="doReject" style="height:32px">Từ chối</button></div>
  </div>
</div>

<div class="lc-overlay" id="mAssign" hidden>
  <div class="lc-modal" role="dialog" aria-labelledby="mAssignTitle" style="max-width:600px">
    <div class="lc-modal__head"><h3 id="mAssignTitle">Giao bài</h3><button class="lc-modal__close" data-lc-close aria-label="Đóng">×</button></div>
    <div class="lc-modal__body lc-stack" style="gap:14px" id="mAssignBody"></div>
    <div class="lc-modal__foot"><button class="lc-btn lc-btn--outline" data-lc-close>Huỷ</button><button class="lc-btn lc-btn--primary" data-action="doAssign" style="height:32px">Giao bài</button></div>
  </div>
</div>

<div class="lc-toast" id="toast" hidden></div>

<script src="../lcms.js"></script>
<script src="../lcms-demo.js"></script>
<script>
(function () {
  var SCHOOL = 'THPT Demo số 1';
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };
  var T = new Date(2026, 10, 1, 8, 30);
  function fmt(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ' ' + pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear(); }
  function stamp() { T = new Date(T.getTime() + 3 * 60000); return fmt(T); }

  // ---------- Vai trò ----------
  var ROLES = {
    gv: { name: 'Nguyễn Thị Lan', title: 'Giáo viên Toán · ' + SCHOOL, label: 'Giáo viên', menu: [['mine', 'Học liệu của tôi', 'my-course'], ['shared', 'Kho dùng chung', 'category']] },
    tt: { name: 'Trần Văn Minh', title: 'Tổ trưởng Tổ Toán · ' + SCHOOL, label: 'Tổ trưởng chuyên môn', menu: [['queue', 'Hàng chờ duyệt', 'icon-skill-setting'], ['shared', 'Kho dùng chung', 'category']] },
    tdv: { name: 'Lê Thu Hà', title: 'Thẩm định viên · Sở GD&ĐT Bắc Ninh', label: 'Thẩm định viên Sở', menu: [['queue', 'Hàng chờ duyệt', 'icon-skill-setting'], ['shared', 'Kho dùng chung', 'category']] },
    ht: { name: 'Nguyễn Văn Thành', title: 'Hiệu trưởng · ' + SCHOOL, label: 'Hiệu trưởng', menu: [['queue', 'Hàng chờ phê duyệt', 'icon-skill-setting'], ['shared', 'Kho dùng chung', 'category']] },
    admin: { name: 'Phạm Quốc Huy', title: 'Quản trị cấp Sở', label: 'Quản trị cấp Sở', menu: [['config', 'Quy trình duyệt', 'icon-roadmap'], ['shared', 'Kho dùng chung', 'category']] }
  };
  var TITLES = { mine: 'Học liệu của tôi', queue: 'Hàng chờ duyệt', shared: 'Kho dùng chung', config: 'Cấu hình quy trình duyệt' };

  // ---------- Khung chương trình CTGDPT 2018 (trích mô phỏng Toán 10, đủ 6 cấp: Môn › Lớp › Mạch › Chủ đề › Bài › YCCĐ) ----------
  var KHUNG = [
    { subject: 'Toán', grade: '10', mach: 'Đại số và Một số yếu tố Giải tích', chude: 'Mệnh đề toán học. Tập hợp', bai: 'Mệnh đề toán học', yccd: [
      ['T10.MĐ.1', 'Thiết lập và phát biểu được các mệnh đề toán học: mệnh đề phủ định, mệnh đề đảo, mệnh đề tương đương, mệnh đề chứa kí hiệu ∀, ∃; điều kiện cần, điều kiện đủ, điều kiện cần và đủ.'],
      ['T10.MĐ.2', 'Xác định được tính đúng/sai của một mệnh đề toán học trong những trường hợp đơn giản.']] },
    { subject: 'Toán', grade: '10', mach: 'Đại số và Một số yếu tố Giải tích', chude: 'Mệnh đề toán học. Tập hợp', bai: 'Tập hợp. Các phép toán trên tập hợp', yccd: [
      ['T10.TH.1', 'Nhận biết được các khái niệm cơ bản về tập hợp (tập con, hai tập hợp bằng nhau, tập rỗng) và sử dụng được các kí hiệu ⊂, ⊃, ∅.'],
      ['T10.TH.2', 'Thực hiện được phép toán trên các tập hợp (hợp, giao, hiệu, phần bù) và dùng biểu đồ Ven để biểu diễn chúng.']] },
    { subject: 'Toán', grade: '10', mach: 'Đại số và Một số yếu tố Giải tích', chude: 'Hàm số, đồ thị và ứng dụng', bai: 'Hàm số bậc hai, đồ thị và ứng dụng', yccd: [
      ['T10.HS.1', 'Thiết lập được bảng giá trị của hàm số bậc hai.'],
      ['T10.HS.2', 'Vẽ được parabol là đồ thị hàm số bậc hai.'],
      ['T10.HS.3', 'Nhận biết được các tính chất cơ bản của parabol như đỉnh, trục đối xứng.']] },
    { subject: 'Toán', grade: '10', mach: 'Hình học và Đo lường', chude: 'Hệ thức lượng trong tam giác. Vectơ', bai: 'Hệ thức lượng trong tam giác', yccd: [
      ['T10.GT.1', 'Giải thích được các hệ thức lượng cơ bản trong tam giác: định lí côsin, định lí sin, công thức tính diện tích tam giác.'],
      ['T10.GT.2', 'Mô tả được cách giải tam giác và vận dụng vào một số bài toán có nội dung thực tiễn.']] },
    { subject: 'Toán', grade: '10', mach: 'Hình học và Đo lường', chude: 'Hệ thức lượng trong tam giác. Vectơ', bai: 'Vectơ', yccd: [
      ['T10.VT.1', 'Nhận biết được khái niệm vectơ, vectơ bằng nhau, vectơ-không.'],
      ['T10.VT.2', 'Thực hiện được các phép toán trên vectơ (tổng, hiệu, tích với một số, tích vô hướng) và mô tả được tính chất hình học bằng vectơ.']] }
  ];
  var SUBJECTS = ['Toán', 'Ngữ văn', 'Tiếng Anh'], GRADES = ['10', '11', '12'];
  var LEVELS = ['Nhận biết', 'Thông hiểu', 'Vận dụng', 'Vận dụng cao'];
  var MTYPES = ['Bài giảng', 'Video bài giảng', 'Bài trình chiếu', 'Phiếu bài tập', 'Đề kiểm tra', 'Sơ đồ tư duy'];
  function uniq(a) { return a.filter(function (x, i) { return a.indexOf(x) === i; }); }
  function khung(f) { return KHUNG.filter(function (k) { return (!f.subject || k.subject === f.subject) && (!f.grade || k.grade === f.grade) && (!f.mach || k.mach === f.mach) && (!f.chude || k.chude === f.chude) && (!f.bai || k.bai === f.bai); }); }
  function yccdText(code) {
    for (var i = 0; i < KHUNG.length; i++) {
      for (var j = 0; j < KHUNG[i].yccd.length; j++) {
        if (KHUNG[i].yccd[j][0] === code) return KHUNG[i].yccd[j][1];
      }
    }
    return '';
  }

  // ---------- Cấu hình quy trình (Quản trị cấp Sở) ----------
  var WHO = { school: ['Tổ trưởng chuyên môn', 'Phó hiệu trưởng phụ trách chuyên môn', 'Hiệu trưởng'], so: ['Hội đồng thẩm định môn', 'Chuyên viên phòng Giáo dục Trung học', 'Lãnh đạo phòng Giáo dục Trung học', 'Lãnh đạo Sở'] };
  var CFG = {
    school: [{ name: 'Tổ trưởng duyệt', who: 'Tổ trưởng chuyên môn', days: 3 }, { name: 'Hiệu trưởng phê duyệt', who: 'Hiệu trưởng', days: 2 }],
    so: [{ name: 'Thẩm định chuyên môn', who: 'Hội đồng thẩm định môn', days: 5 }, { name: 'Phê duyệt xuất bản', who: 'Lãnh đạo phòng Giáo dục Trung học', days: 2 }],
    requireSchool: true, reasonRequired: true, notifyApp: true, notifyEmail: false, applyMaterial: true, applyQuestion: true
  };

  // ---------- Dữ liệu mẫu (mô phỏng) ----------
  var seq = 0;
  function mk(o) {
    var it = { id: o.id || 'n' + (++seq), kind: 'material', title: '', type: 'pdf', mtype: 'Bài giảng', file: '', size: '', meta: '', qs: [],
      owner: ROLES.gv.name, ownerRole: 'gv', school: SCHOOL, subject: '', grade: '', mach: '', chude: '', bai: '', yccd: [], level: '', keywords: [], desc: '',
      wf: { stage: 'draft', step: 0 }, schoolOk: false, hist: [], updated: '' };
    for (var k in o) it[k] = o[k];
    if (!it.updated && it.hist.length) it.updated = it.hist[it.hist.length - 1].t;
    return it;
  }
  function H(t, who, role, act, cls, note) { return { t: t, who: who, role: role, act: act, cls: cls || '', note: note || '' }; }
  var GV = ROLES.gv.name, TT = ROLES.tt.name, HT = ROLES.ht.name;
  var tagMenh = { subject: 'Toán', grade: '10', mach: 'Đại số và Một số yếu tố Giải tích', chude: 'Mệnh đề toán học. Tập hợp' };
  function lab(base, extra) { var o = {}; for (var k in base) o[k] = base[k]; for (var j in extra) o[j] = extra[j]; return o; }

  // Câu hỏi trong ngân hàng: cùng dạng với 12-question-bank.html
  var QTYPES = { mcq: 'Trắc nghiệm', tf: 'Đúng/Sai', short: 'Trả lời ngắn', essay: 'Tự luận' };
  function Qz(type, level, stem, extra) { var o = { type: type, level: level, stem: stem, opts: [], correct: 0, stmts: [], ans: '' }; for (var k in extra) o[k] = extra[k]; return o; }
  function tf(a) { return a.map(function (s) { return { text: s[0], ok: s[1] }; }); }
  var POOL = {
    menh: [
      Qz('mcq', 'Nhận biết', 'Câu nào sau đây là mệnh đề?', { opts: ['Hà Nội là thủ đô của Việt Nam', 'Bạn có khoẻ không?', 'Hãy đóng cửa lại', 'x + 1 > 3'] }),
      Qz('mcq', 'Thông hiểu', 'Mệnh đề phủ định của mệnh đề “∀x ∈ ℝ, x² ≥ 0” là', { opts: ['∃x ∈ ℝ, x² < 0', '∀x ∈ ℝ, x² < 0', '∃x ∈ ℝ, x² ≥ 0', '∀x ∈ ℝ, x² ≤ 0'] }),
      Qz('tf', 'Thông hiểu', 'Xét tính đúng sai của các mệnh đề sau:', { stmts: tf([['“5 là số nguyên tố” là mệnh đề đúng.', true], ['“∃x ∈ ℕ, x² = 2” là mệnh đề đúng.', false], ['Phủ định của “x > 2” là “x < 2”.', false], ['“Nếu a ⋮ 6 thì a ⋮ 3” là mệnh đề đúng.', true]]) }),
      Qz('short', 'Vận dụng', 'Có bao nhiêu số nguyên x thoả mãn mệnh đề chứa biến “x² < 10” là mệnh đề đúng?', { ans: '7' })
    ],
    parabol: [
      Qz('mcq', 'Nhận biết', 'Đỉnh của parabol y = x² − 4x + 3 là', { opts: ['I(2; −1)', 'I(−2; 15)', 'I(4; 3)', 'I(1; 0)'] }),
      Qz('tf', 'Vận dụng', 'Cho hàm số y = x² − 4x + 3 có đồ thị là parabol (P). Xét tính đúng sai của các khẳng định sau:', { stmts: tf([['(P) có trục đối xứng là đường thẳng x = 2.', true], ['Đỉnh của (P) là điểm I(2; 1).', false], ['Hàm số đồng biến trên khoảng (2; +∞).', true], ['(P) cắt trục hoành tại hai điểm có hoành độ 1 và 3.', true]]) }),
      Qz('short', 'Thông hiểu', 'Giá trị lớn nhất của hàm số y = −x² + 4x − 1 là bao nhiêu?', { ans: '3' }),
      Qz('mcq', 'Thông hiểu', 'Parabol y = −x² + 2x + 3 có bề lõm', { opts: ['quay xuống dưới', 'quay lên trên', 'quay sang phải', 'quay sang trái'] })
    ],
    cosin: [
      Qz('mcq', 'Thông hiểu', 'Cho tam giác ABC có AB = 5, AC = 8 và góc A = 60°. Độ dài cạnh BC bằng', { opts: ['7', '√89', '49', '√129'] }),
      Qz('short', 'Vận dụng', 'Tam giác có ba cạnh 13, 14, 15. Diện tích tam giác bằng bao nhiêu?', { ans: '84' }),
      Qz('essay', 'Vận dụng', 'Một người đứng cách chân tháp 50 m, nhìn đỉnh tháp với góc nâng 35°. Tính chiều cao tháp (làm tròn đến hàng phần mười).')
    ],
    taphop: [
      Qz('mcq', 'Nhận biết', 'Cho A = {1; 2; 3; 4} và B = {3; 4; 5}. Tập hợp A ∩ B là', { opts: ['{3; 4}', '{1; 2}', '{1; 2; 3; 4; 5}', '{5}'] }),

      if (f.level && (it.kind === 'bank' ? !it.qs.some(function (x) { return x.level === f.level; }) : it.level !== f.level)) return false;
      if (f.yccd && it.yccd.indexOf(f.yccd) < 0) return false;
      return !qq || (it.title + ' ' + it.keywords.join(' ') + ' ' + it.qs.map(function (x) { return x.stem; }).join(' ') + ' ' + it.desc).toLowerCase().indexOf(qq) >= 0;

  function saveLabel(andSubmit) {
    var e = S.edit, d = e.d, err = {};
    if (!d.title.trim()) err.title = 'Nhập tên.';
    if (d.kind === 'material' && !d.file) err.file = 'Chọn tệp học liệu.';
    if (d.kind === 'bank' && e.isNew && !d.src) err.src = 'Chọn ngân hàng câu hỏi cần gửi.';
    if (!d.bai) err.bai = 'Chọn đến cấp Bài trong khung chương trình.';
    else if (!d.yccd.length) err.yccd = 'Chọn ít nhất một yêu cầu cần đạt.';
    e.err = err;
    if (Object.keys(err).length) { renderLabel(); return; }
    var it = e.id ? byId(e.id) : null, wasLabeled = it && labeled(it);
    if (!it) {
      it = mk({ kind: d.kind, type: d.type, src: d.src, hist: [] });
      items.unshift(it);
      addHist(it, 'gv', d.kind === 'bank' ? 'Chọn ngân hàng câu hỏi để gửi duyệt' : 'Tạo mới học liệu', '', '');
    }
    ['title', 'type', 'mtype', 'file', 'size', 'meta', 'subject', 'grade', 'mach', 'chude', 'bai', 'level', 'desc'].forEach(function (k) { it[k] = d[k]; });
    it.qs = d.qs.slice(); it.yccd = d.yccd.slice();
    it.keywords = d.keywords.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    addHist(it, 'gv', wasLabeled ? 'Cập nhật nhãn' : 'Gán nhãn theo khung chương trình', it.subject + ' ' + it.grade + ' · ' + it.bai + ' · ' + it.yccd.join(', '), '');
    $('mLabel').hidden = true; S.edit = null;
    if (S.role === 'gv') { S.mineKind = it.kind; }
    if (andSubmit) openSubmit(it.id); else toast('Đã lưu nhãn cho ' + q(it));
    render();
  }

  // ---------- Modal gửi duyệt ----------
  function openSubmit(id) {
    var it = byId(id), cs = canSchool(it), cso = canSo(it);
    S.submitId = id;
    var card = function (lvl, ok, extra) {
      var st = CFG[lvl];
      return '<label class="lc-radio-card' + (ok ? '' : ' is-disabled') + '"><input type="radio" name="target" value="' + lvl + '"' + (ok ? '' : ' disabled') + (ok && (lvl === 'so' ? !cs : true) ? ' checked' : '') + '><div><b>' + (lvl === 'school' ? 'Kho Trường · ' + SCHOOL : 'Kho Sở · dùng chung toàn tỉnh') + '</b><p>' + st.length + ' bước: ' + st.map(function (s) { return esc(s.name) + ' (' + esc(s.who) + ')'; }).join(' → ') + '</p>' + (extra || '') + '</div></label>';
    };
    $('mSubmitBody').innerHTML = '<div style="margin-bottom:14px">' + fileHtml(it) + '</div>' + labelsHtml(it) +
      '<div class="lc-stack" style="gap:10px;margin-top:16px">' +
        card('school', cs, it.schoolOk ? '<p><span class="lc-tag lc-tag--sm lc-tag--info">Đã duyệt vào Kho Trường</span></p>' : '') +
        card('so', cso, !cso && CFG.requireSchool && !it.schoolOk ? '<p class="lc-err">Cần được duyệt vào Kho Trường trước (theo cấu hình của Sở).</p>' : '') + '</div>' +
      '<div class="lc-field" style="margin-top:16px"><label class="lc-label" for="submitNote">Ghi chú gửi người duyệt</label><textarea class="lc-textarea" id="submitNote" rows="2" placeholder="Ví dụ: dùng cho tiết 2 bài Mệnh đề"></textarea></div>';
    $('mSubmit').hidden = false;
  }

  // ---------- Render tổng ----------
  // Vai trò 09 ứng với vai trò chung của LCMS (Sở không dùng menu trường)
  var LCMS_ROLE = { gv: 'gv', tt: 'tt', ht: 'ht', tdv: 'so', admin: 'so' };
  function renderMenu() {
    var r = ROLES[S.role], v = S.view[S.role];
    $('menu').innerHTML = (LCMS_ROLE[S.role] && LCMS_ROLE[S.role] !== 'so' ? '<div class="lc-menu__group">Học liệu & duyệt kho</div>' : '') + r.menu.map(function (m) {
      var badge = m[0] === 'queue' && pendingFor(S.role).length ? '<span class="badge">' + pendingFor(S.role).length + '</span>' : '';
      return '<a class="lc-menu__item' + (m[0] === v ? ' is-active' : '') + '" href="#" data-action="nav" data-v="' + m[0] + '"><img src="../assets/icons/' + m[2] + '.svg" alt=""><span>' + m[1] + '</span>' + badge + '</a>';
    }).join('') + (LCMS_ROLE[S.role] ? LcDemo.menuHTML(LCMS_ROLE[S.role], 'hoclieu', true) : '');
  }
  function renderHeader() {
    var r = ROLES[S.role], v = S.view[S.role];
    $('pageTitle').textContent = S.reviewId ? 'Duyệt ' + (byId(S.reviewId).kind === 'material' ? 'học liệu' : 'ngân hàng câu hỏi') : (S.role === 'hs' && v === 'shared' ? 'Kho học liệu' : TITLES[v]);
    $('userName').textContent = r.name; $('userTitle').textContent = r.title;
    $('roleSel').innerHTML = Object.keys(ROLES).map(function (k) { return '<option value="' + k + '"' + (k === S.role ? ' selected' : '') + '>' + ROLES[k].label + '</option>'; }).join('');
    var mine = notifs.filter(function (n) { return n.to === S.role; }), unread = mine.filter(function (n) { return !n.read; }).length;
    $('bellCount').hidden = !unread; $('bellCount').textContent = unread;
    $('notif').innerHTML = '<div class="lc-notif__head">Thông báo<button data-action="readAll">Đánh dấu đã đọc</button></div><div class="lc-notif__list">' +
      (mine.length ? mine.map(function (n) { return '<div class="lc-notif__item' + (n.read ? '' : ' is-unread') + '" data-action="notif" data-n="' + notifs.indexOf(n) + '"><span class="ic ic--' + n.ic + '">' + { ok: '✓', no: '✕', wait: '⏳', info: 'i' }[n.ic] + '</span><div>' + n.text + '<small>' + n.t + '</small></div></div>'; }).join('') : '<div class="lc-notif__empty">Chưa có thông báo.</div>') + '</div>';
  }
  // Chỉ học liệu đã duyệt, không gồm ngân hàng câu hỏi → LMS › Học liệu của học sinh đọc lại (design-system/templates/15-shared-materials.html)
  function publishToLms() {
    var out = items.filter(function (it) { return it.kind === 'material' && inShared(it); }).map(function (it) {
      return { id: it.id, kind: it.kind, title: it.title, type: it.type, mtype: it.mtype, meta: it.meta,
        subject: it.subject, grade: it.grade, chude: it.chude, bai: it.bai, level: it.level, owner: it.owner, school: it.school, src: source(it), t: it.updated || lastSent(it) };
    });
    try { localStorage.setItem('bn-shared-materials', JSON.stringify({ at: fmt(T), items: out })); } catch (e) {}
  }
  function render() {
    keepState(); publishToLms();
    renderMenu(); renderHeader();
    var v = S.view[S.role], out = v === 'mine' ? viewMine() : v === 'queue' ? viewQueue() : v === 'config' ? viewConfig() : viewShared();
    renderHeader();
    $('main').innerHTML = out.html; $('foot').innerHTML = out.foot; $('foot').hidden = !out.foot;
    renderDrawer();
  }
  function toast(msg) { var t = $('toast'); t.innerHTML = '<span class="ok">✓</span>' + msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(function () { t.hidden = true; }, 2600); }

  // ---------- Sự kiện ----------
  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-action]'); if (!el) return;
    var a = el.dataset.action, id = el.dataset.id, it = id && byId(id);
    if (el.tagName === 'A') ev.preventDefault();
    switch (a) {
      case 'nav': S.view[S.role] = el.dataset.v; S.reviewId = null; S.drawerId = null; render(); break;
      case 'mineKind': S.mineKind = el.dataset.v; render(); break;
      case 'queueTab': S.queueTab = el.dataset.v; render(); break;
      case 'sharedKind': S.sharedKind = el.dataset.v; $('sharedResults').innerHTML = sharedResults(); break;
      case 'drawerTab': S.drawerTab = el.dataset.v; renderDrawer(); break;
      case 'open': S.drawerId = id; S.drawerTab = 'info'; renderDrawer(); break;
      case 'assign': openAssign(id); break;
      case 'copyBank': toast('Đã sao chép ' + q(it) + ' (' + it.qs.length + ' câu) về Ngân hàng câu hỏi của tôi'); break;
      case 'doAssign': doAssign(); break;
      case 'closeDrawer': S.drawerId = null; renderDrawer(); break;
      case 'new': openLabel(null, S.mineKind); break;
      case 'label': S.drawerId = null; renderDrawer(); openLabel(id); break;
      case 'submit': S.drawerId = null; renderDrawer(); openSubmit(id); break;
      case 'review': S.view[S.role] = 'queue'; S.reviewId = id; S.drawerId = null; render(); $('main').scrollTop = 0; break;
      case 'backQueue': S.reviewId = null; render(); break;
      case 'approve': approve(it, ($('reviewNote') || {}).value || ''); S.reviewId = null; render(); break;
      case 'rejectOpen': S.rejectId = id; $('rejDetail').value = ''; $('rejErr').hidden = true; $('rejReq').hidden = !CFG.reasonRequired; $('mReject').hidden = false; break;
      case 'doReject': {
        var detail = $('rejDetail').value.trim();
        if (CFG.reasonRequired && !detail) { $('rejErr').hidden = false; return; }
        reject(byId(S.rejectId), $('rejReason').value, detail); $('mReject').hidden = true; S.reviewId = null; render(); break;
      }
      case 'doSubmit': {
        var r = document.querySelector('#mSubmitBody input[name=target]:checked'); if (!r) return;
        submit(byId(S.submitId), r.value, $('submitNote').value.trim()); $('mSubmit').hidden = true; render(); break;
      }
      case 'saveLabel': saveLabel(false); break;
      case 'saveLabelSubmit': saveLabel(true); break;
      case 'sampleFile': {
        var d = S.edit.d, v = el.dataset.v === 'video';
        d.file = v ? 'video-bai-giang-menh-de.mp4' : 'phieu-hoc-tap-menh-de.pdf'; d.type = v ? 'video' : 'pdf'; d.size = v ? '42 MB' : '1,6 MB'; d.meta = v ? '03:20' : '6 trang'; d.mtype = v ? 'Video bài giảng' : 'Phiếu bài tập';
        if (!d.title) d.title = v ? 'Video: Mệnh đề toán học' : 'Phiếu học tập Mệnh đề'; renderLabel(); break;
      }
      case 'clearFilter': S.f = { so: true, school: true, subject: '', grade: '', mach: '', chude: '', bai: '', yccd: '', level: '' }; S.q = ''; render(); break;
      case 'cfgAdd': { var lv = el.dataset.lvl; CFG[lv].push({ name: 'Bước duyệt mới', who: WHO[lv][0], days: 3 }); render(); break; }
      case 'cfgDel': CFG[el.dataset.lvl].splice(+el.dataset.i, 1); render(); break;
      case 'cfgSave': toast('Đã lưu cấu hình quy trình duyệt'); break;
      case 'readAll': notifs.forEach(function (n) { if (n.to === S.role) n.read = true; }); renderHeader(); break;
      case 'notif': {
        var n = notifs[+el.dataset.n], t = byId(n.id); n.read = true; $('notif').hidden = true;
        if (t && pendingFor(S.role).indexOf(t) >= 0) { S.view[S.role] = 'queue'; S.reviewId = t.id; S.drawerId = null; }
        else { S.drawerId = n.id; S.drawerTab = 'info'; }
        render(); break;
      }
    }
  });
  document.addEventListener('change', function (ev) {
    var t = ev.target, k = t.dataset.change, cf = t.dataset.cfg, flag = t.dataset.cfgflag;
    if (t.id === 'roleSel') { S.role = t.value; if (LCMS_ROLE[S.role]) LcDemo.setRole(LCMS_ROLE[S.role]); S.reviewId = null; S.drawerId = null; document.querySelectorAll('.lc-overlay').forEach(function (o) { o.hidden = true; }); render(); return; }
    if (cf) { var s = CFG[t.dataset.lvl][+t.dataset.i]; s[cf] = cf === 'days' ? Math.max(1, +t.value || 1) : t.value; render(); return; }
    if (flag) { CFG[flag] = t.checked; render(); return; }
    if (!k) return;
    if (k === 'mineStatus') { S.mineStatus = t.value; $('mineTable').innerHTML = mineTable(); return; }
    if (k === 'queueKind') { S.queueKind = t.value; render(); return; }
    if (k.indexOf('f.') === 0) {
      var key = k.slice(2), f = S.f;
      f[key] = t.type === 'checkbox' ? t.checked : t.value;
      var order = ['subject', 'grade', 'mach', 'chude', 'bai', 'yccd'], at = order.indexOf(key);
      if (at >= 0) order.slice(at + 1).forEach(function (o) { f[o] = ''; });
      render(); return;
    }
    var d = S.edit && S.edit.d; if (!d) return;
    if (k === 'file' && t.files.length) {
      var fl = t.files[0], ext = fl.name.split('.').pop().toLowerCase();
      d.file = fl.name; d.size = (fl.size / 1048576).toFixed(1).replace('.', ',') + ' MB';
      d.type = ext === 'mp4' ? 'video' : /pptx?/.test(ext) ? 'ppt' : /docx?/.test(ext) ? 'doc' : 'pdf';
      d.meta = d.type === 'video' ? '—' : 'Đang đọc số trang'; d.mtype = d.type === 'video' ? 'Video bài giảng' : d.mtype;
      if (!d.title) d.title = fl.name.replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' ');
    } else if (k === 'd.yccd') {
      if (t.checked) d.yccd.push(t.value); else d.yccd = d.yccd.filter(function (x) { return x !== t.value; });
    } else if (k === 'd.src') {
      var b = MY_BANKS.filter(function (x) { return x.id === t.value; })[0];
      d.src = t.value; d.qs = b ? b.qs.slice() : [];
      if (b && (!d.title || MY_BANKS.some(function (x) { return x.name === d.title; }))) d.title = b.name;
    } else {
      var fk = k.slice(2); d[fk] = t.value;
      var ord = ['subject', 'grade', 'mach', 'chude', 'bai'], p = ord.indexOf(fk);
      if (p >= 0) { ord.slice(p + 1).forEach(function (o) { d[o] = ''; }); d.yccd = []; }
    }
    S.edit.err = {}; renderLabel();
  });
  document.addEventListener('input', function (ev) {
    var t = ev.target, k = t.dataset.input; if (!k) return;
    if (k === 'mineQ') { S.mineQ = t.value; $('mineTable').innerHTML = mineTable(); return; }
    if (k === 'q') { S.q = t.value; $('sharedResults').innerHTML = sharedResults(); return; }
    var d = S.edit && S.edit.d; if (!d) return;
    d[k.slice(2)] = t.value;
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && S.drawerId && !document.querySelector('.lc-overlay:not([hidden])')) { S.drawerId = null; renderDrawer(); }
  }, true); // pha capture: chạy trước lcms.js để không đóng drawer khi Esc đang đóng modal

  var urlRole = new URLSearchParams(location.search).get('role');
  S.role = ROLES[urlRole] ? urlRole : { gv: 'gv', gvcn: 'gv', ct: 'gv', tt: 'tt', ht: 'ht', so: 'admin' }[LcDemo.role()] || 'gv';
  render();
})();
</script>
</body>
</html>
